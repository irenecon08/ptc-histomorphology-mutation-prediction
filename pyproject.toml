[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ptc-mil"
version = "0.1.0"
description = "Predicting driver alterations in papillary thyroid carcinoma from H&E whole-slide images with attention-based multiple instance learning."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Irene Constantinidou" }]
requires-python = ">=3.10"

# Core: what the library needs to train and evaluate models on extracted embeddings.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "h5py>=3.10",
    "torch>=2.5",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Whole-slide image processing: tiling and UNI2-h feature extraction (needs a GPU in practice).
wsi = [
    "openslide-python>=1.4",
    "openslide-bin>=4.0",
    "torchvision>=0.20",
    "timm>=1.0",
    "huggingface_hub>=0.24",
    "scikit-image>=0.24",
    "pillow>=10.0",
    "tqdm>=4.66",
]
# Dissertation analyses: TIIC, morphology, embeddings, figures.
analysis = [
    "tiatoolbox>=2.0",
    "opencv-python>=4.9",
    "statsmodels>=0.14",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
ptc-mil = "ptc_mil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
